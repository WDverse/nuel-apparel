<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Nuel's Apparel</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./asset/css/style.css">
    </head>


    <body>

        <header>
            <h1>Nuel's Apparel</h1>
            <p>For all your summer steeze</p>
        </header>

        <main id="main">
            <section id ="menu" class="menu">

            </section>

            <section id="pre-checkout" class="pre-checkout">
                <div class="order-container" id="order-container">
                    <h2>Your Order</h2>
                    <ul id="order-list"class="order-list">

                    </ul>
                    <div>
                        <span>Total Price</span>
                        <span id="total-amt" class="total-amt"></span>
                    </div>

                    <div>
                        <button>Complete Order</button>
                    </div>

                </div>
            </section>
        </main>

        <div id="modal" class="modal">
            <form>
                <h3>Enter Card Details</h3>
                <input id="username" type="text" placeholder="Enter your name">
                <input type="password" placeholder="Enter card number">
                <input type="password" placeholder="Enter CVV">
                <button class="pay-btn" id="pay-btn" type="submit">Pay</button>
            </form>

        </div>

        <script src="./asset/js/index.js" type="module"></script>
    </body>
</html>
